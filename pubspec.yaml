name: communityhub
description: CommunityHub — Faith meets Tech. A unified platform for spiritual growth and technical empowerment.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Supabase ──────────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.2.0

  # ── UI Components ─────────────────────────────────────────
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  badges: ^3.1.2
  smooth_page_indicator: ^1.1.0
  photo_view: ^0.15.0
  image_picker: ^1.1.2

  # ── Camera & Live ─────────────────────────────────────────
  camera: ^0.11.0+2
  livekit_client: ^2.8.0
  # agora_rtc_engine removed — no version satisfies this project's constraints:
  # 6.6.2+ conflicts with flutter_secure_storage on the `ffi` version; 6.5.4 and
  # earlier ship an AAR compiled against android-31, which fails Gradle's AAR
  # metadata check against the compileSdk 34+ required by other plugins already
  # in this app (camera, stripe, etc.). Replaced with LiveKit.

  # ── Video & Media ─────────────────────────────────────────
  youtube_player_flutter: ^9.0.3
  youtube_player_iframe: 6.0.2
  webview_flutter: ^4.10.0
  video_player: ^2.8.7
  chewie: ^1.8.1
  audioplayers: ^6.0.0

  # ── Networking ────────────────────────────────────────────
  dio: ^5.4.3+1
  connectivity_plus: ^7.2.0

  # ── Payments ──────────────────────────────────────────────
  flutter_stripe: ^11.1.0
  # Paystack + M-Pesa have no official Flutter SDK — handled via
  # Supabase Edge Functions + webview_flutter (already a dependency)

  # ── Ads ───────────────────────────────────────────────────
  google_mobile_ads: ^9.0.0

  # ── Authentication ────────────────────────────────────────
  google_sign_in: ^6.2.1
  flutter_secure_storage: ^9.2.2

  # ── Notifications ─────────────────────────────────────────
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1+1

  # ── Storage & Permissions ─────────────────────────────────
  photo_manager: ^3.5.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.3
  share_plus: ^10.0.0

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.19.0
  timeago: ^3.6.1
  uuid: ^4.4.0
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  url_launcher: ^6.3.0
  flutter_animate: ^4.5.0
  pull_to_refresh: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_18pt-Regular.ttf
        - asset: assets/fonts/Inter_18pt-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter_18pt-SemiBold.ttf
          weight: 600
