<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="CommunityHub — faith, learning and career communities, events, scripture study, and marketplace in one app.">
  <meta name="theme-color" content="#0D1117">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CommunityHub">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CommunityHub</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Google Sign-In (used by the YouTube-connect feature in
    reels_screen.dart to request an incremental upload scope) needs a
    *web* OAuth client id on this platform — the Android/iOS client ids
    in your Firebase/Google Cloud project don't cover web. Create a Web
    application OAuth client in Google Cloud Console (APIs & Services →
    Credentials) with this deployed origin as an authorized JavaScript
    origin, then uncomment and fill in the line below. Until then,
    Google Sign-In through Supabase Auth's OAuth redirect (login screen)
    still works fine on web without this tag — only the YouTube-scope
    request in reels_screen.dart needs it.
  -->
  <!-- <meta name="google-signin-client_id" content="YOUR_WEB_CLIENT_ID.apps.googleusercontent.com"> -->
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
